name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A job of its own rather than a step on the build below, so that a pull request reports
  # "the code is broken" and "the code is wrong" as two separate failures, and so that both
  # can be required independently before a merge. It builds only PowerPeekCore and the test
  # binary, not the UI, which is why running it twice over costs little.
  test:
    name: Unit tests (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The same script a developer runs, for the same reason vsenv.bat is shared: a test
      # that passes here and fails locally, or the reverse, is a bug in the harness rather
      # than in the code, and one script cannot drift from itself. The JUnit report is what
      # makes a failure readable in the run summary without downloading anything.
      - name: Build and run the unit tests
        shell: cmd
        run: call tools\test.bat --output-junit "%CD%\build\tests\junit.xml" || exit /b 1

      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PowerPeek-test-report
          path: build/tests/junit.xml
          if-no-files-found: warn

  build:
    name: Build (x64, RelWithDebInfo)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # No toolchain to install. The windows-latest image ships Visual Studio 2022
      # Enterprise with the "Desktop development with C++" workload
      # (Microsoft.VisualStudio.Component.VC.Tools.x86.x64), the Windows 11 SDK
      # 10.0.26100.0, CMake 3.31 and Ninja 1.13 -- everything this project needs.
      #
      # vsenv.bat is the same script a local build uses: it locates Visual Studio with
      # vswhere and prefers the CMake and Ninja bundled with it, so CI and a developer
      # machine run an identical toolchain discovery instead of two that drift apart.
      # It must be CALLed, and the shell must be cmd, because it works by leaving the
      # vcvars64 environment behind for the following lines.
      - name: Build
        shell: cmd
        run: |
          call tools\vsenv.bat || exit /b 1
          "%PP_CMAKE%" --preset release -DCMAKE_MAKE_PROGRAM="%PP_NINJA%" -DPP_WARNINGS_AS_ERRORS=ON || exit /b 1
          "%PP_CMAKE%" --build --preset release || exit /b 1

      # The version in the binary's file properties comes from version.txt through a
      # generated header and rc.exe. That is several steps of indirection, and a break in
      # it is invisible until someone right-clicks the executable, so assert it here.
      - name: Verify the version resource
        shell: pwsh
        run: |
          $expected = (Get-Content version.txt -Raw).Trim()
          $actual = (Get-Item build\release\PowerPeek.exe).VersionInfo.FileVersion
          if ($actual -ne "$expected.0") {
              throw "version.txt says $expected, but the executable reports $actual."
          }
          Write-Host "Version resource: $actual"

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: PowerPeek-x64
          path: |
            build/release/PowerPeek.exe
            build/release/PowerPeek.pdb
          if-no-files-found: error

      # windows-latest ships Inno Setup -- the runner image manifest lists "InnoSetup 6.7.1"
      # under Tools -- so this finds it and does nothing. The image is not pinned and drops
      # tools between revisions without warning, hence the fallback: the same version from
      # Chocolatey, which is preinstalled on the runner and needs no secrets.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
              Write-Host "Inno Setup is on the image."
          } else {
              choco install innosetup --version=6.7.1 --no-progress --yes
          }

      # The same script the release build runs, so a broken installer script fails here, on
      # the pull request, rather than on a release nobody can undo.
      - name: Package the installer and the portable zip
        shell: cmd
        run: call tools\package.bat || exit /b 1

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: PowerPeek-packages
          path: dist/*
          if-no-files-found: error
