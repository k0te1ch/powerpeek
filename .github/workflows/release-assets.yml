name: Release assets

# Builds PowerPeek and attaches both release assets -- the installer and the portable zip
# -- to a published release.
#
# Read this before changing the triggers. A tag pushed by release-please carries the
# default GITHUB_TOKEN, and GitHub deliberately does not start new workflow runs from
# anything that token does. So `on: push: tags:` here would never fire -- no error, no
# skipped run, just silence and a release with no binary on it. The `release` trigger has
# the same blind spot for release-please's own releases, which is why release-please.yml
# calls this workflow directly (workflow_call) the moment it publishes one.
#
# The `release` trigger below therefore covers the other case: a release published by
# hand from the GitHub UI. workflow_dispatch is the manual retry when a build failed and
# the release already exists.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag of the release to attach the executable to.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release to attach the executable to.
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach:
    name: Build and attach
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      # Same toolchain discovery as ci.yml; see the comment there. Warnings are not
      # errors on this path: the commit being released has already passed CI, and a
      # warning introduced by a newer toolset on the runner image should not be able to
      # leave a published release with no binary attached to it.
      - name: Build
        shell: cmd
        run: |
          call tools\vsenv.bat || exit /b 1
          "%PP_CMAKE%" --preset release -DCMAKE_MAKE_PROGRAM="%PP_NINJA%" || exit /b 1
          "%PP_CMAKE%" --build --preset release || exit /b 1

      # The asset names come from version.txt -- the same file the installer and the compiled
      # VERSIONINFO read -- and release-please derives the tag from it too. A tag that
      # disagrees means the release was cut by hand from the wrong commit, and would publish
      # a v1.2.0 release full of 1.1.0 files.
      - name: Check the tag against version.txt
        shell: pwsh
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          if ($env:TAG -ne "v$version") {
              throw "The release is tagged $env:TAG, but version.txt says $version."
          }

      # See the comment on the same step in ci.yml: windows-latest ships Inno Setup 6.7.1,
      # and this only has to do something if a future image revision drops it.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") {
              Write-Host "Inno Setup is on the image."
          } else {
              choco install innosetup --version=6.7.1 --no-progress --yes
          }

      # Produces dist\PowerPeek-Setup-<version>.exe, dist\PowerPeek-<version>-portable.zip
      # and a SHA-256 sidecar for each. Every file in dist is attached below.
      - name: Package
        shell: cmd
        run: call tools\package.bat || exit /b 1

      # --clobber keeps this idempotent, so a manual re-run after a failed build replaces
      # the assets instead of failing on the ones that did upload.
      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = Get-ChildItem dist -File | ForEach-Object FullName
          gh release upload $env:TAG $assets --clobber
