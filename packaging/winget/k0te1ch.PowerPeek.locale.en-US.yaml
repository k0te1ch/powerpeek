ShortDescription: Xbox controller battery level in the notification area, with the warnings you actually want.
Description: >-
  PowerPeek puts your Xbox controller's battery level in the Windows notification area
  and warns you before it dies instead of after. A live tray icon (battery, ring gauge
  or percentage), configurable sounds, Fluent-styled and Windows Action Center
  notifications, and a battery history chart. No telemetry, no accounts, no network
  code.
