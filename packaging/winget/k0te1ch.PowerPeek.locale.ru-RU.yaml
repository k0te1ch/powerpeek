Description: >-
  PowerPeek показывает заряд геймпада Xbox в области уведомлений Windows и
  предупреждает до того, как геймпад выключится, а не после. Живой значок в трее
  (батарея, кольцо или проценты), настраиваемые звуки, уведомления в стиле Fluent и
  уведомления Центра уведомлений Windows, график истории заряда. Без телеметрии, без
  аккаунтов, без единой сетевой строчки кода.
